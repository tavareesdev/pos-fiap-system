# ATENÇÃO: este arquivo é um exemplo. Em produção, NUNCA versione secrets em
# texto puro — use um cofre externo (Sealed Secrets, External Secrets Operator,
# Vault, AWS/GCP Secrets Manager, etc). Os valores abaixo devem ser
# substituídos e/ou este arquivo removido do controle de versão.
apiVersion: v1
kind: Secret
metadata:
  name: posfiap-secrets
  namespace: posfiap
type: Opaque
stringData:
  POSTGRES_USER: posfiap
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: posfiap
  JWT_SECRET_KEY: "CHANGE_ME_SUPER_SECRET_KEY_WITH_AT_LEAST_32_CHARS"
  GROQ_API_KEY: "CHANGE_ME_GROQ_API_KEY"
