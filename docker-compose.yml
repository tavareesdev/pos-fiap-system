services:
  postgres:
    image: postgres:16-alpine
    container_name: posfiap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: posfiap
      POSTGRES_USER: posfiap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posfiap_local_pw}
    ports:
      - "5432:5432"
    volumes:
      - posfiap-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posfiap"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: posfiap-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=posfiap;Username=posfiap;Password=${POSTGRES_PASSWORD:-posfiap_local_pw}"
      Jwt__SecretKey: ${JWT_SECRET_KEY:-CHANGE_ME_SUPER_SECRET_KEY_WITH_AT_LEAST_32_CHARS}
      Jwt__Issuer: PosFiap.API
      Jwt__Audience: PosFiap.Frontend
      Groq__ApiKey: ${GROQ_API_KEY:?defina GROQ_API_KEY no .env}
      Groq__Model: ${GROQ_MODEL:-openai/gpt-oss-120b}
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: posfiap-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:8080"

volumes:
  posfiap-db-data:
